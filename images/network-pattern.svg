<svg width="1920" height="1080" viewBox="0 0 1920 1080"
     xmlns="http://www.w3.org/2000/svg">

    <defs>

        <linearGradient id="lineGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00D4FF"/>
            <stop offset="50%" stop-color="#7B2CFF"/>
            <stop offset="100%" stop-color="#FF2D8D"/>
        </linearGradient>

        <filter id="glow">
            <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>

    </defs>

    <!-- Connection Lines -->

    <g stroke="url(#lineGradient)"
       stroke-width="2.5"
       opacity="0.65">

        <line x1="200" y1="180" x2="420" y2="260"/>
        <line x1="420" y1="260" x2="620" y2="150"/>
        <line x1="620" y1="150" x2="840" y2="280"/>
        <line x1="840" y1="280" x2="1080" y2="190"/>
        <line x1="1080" y1="190" x2="1320" y2="320"/>

        <line x1="1320" y1="320" x2="1550" y2="180"/>
        <line x1="1550" y1="180" x2="1730" y2="300"/>

        <line x1="350" y1="520" x2="600" y2="650"/>
        <line x1="600" y1="650" x2="860" y2="500"/>
        <line x1="860" y1="500" x2="1140" y2="690"/>

        <line x1="1140" y1="690" x2="1450" y2="560"/>
        <line x1="1450" y1="560" x2="1700" y2="720"/>

        <line x1="500" y1="850" x2="750" y2="930"/>
        <line x1="750" y1="930" x2="1020" y2="800"/>
        <line x1="1020" y1="800" x2="1280" y2="940"/>

    </g>

    <!-- Nodes -->

    <g filter="url(#glow)">

        <circle cx="200" cy="180" r="5" fill="#00D4FF"/>
        <circle cx="420" cy="260" r="5" fill="#7B2CFF"/>
        <circle cx="620" cy="150" r="5" fill="#00D4FF"/>
        <circle cx="840" cy="280" r="5" fill="#FF2D8D"/>

        <circle cx="1080" cy="190" r="5" fill="#00D4FF"/>
        <circle cx="1320" cy="320" r="5" fill="#7B2CFF"/>
        <circle cx="1550" cy="180" r="5" fill="#FF2D8D"/>
        <circle cx="1730" cy="300" r="5" fill="#00D4FF"/>

        <circle cx="350" cy="520" r="5" fill="#7B2CFF"/>
        <circle cx="600" cy="650" r="5" fill="#00D4FF"/>
        <circle cx="860" cy="500" r="5" fill="#FF2D8D"/>

        <circle cx="1140" cy="690" r="5" fill="#00D4FF"/>
        <circle cx="1450" cy="560" r="5" fill="#7B2CFF"/>
        <circle cx="1700" cy="720" r="5" fill="#FF2D8D"/>

        <circle cx="500" cy="850" r="5" fill="#00D4FF"/>
        <circle cx="750" cy="930" r="5" fill="#7B2CFF"/>
        <circle cx="1020" cy="800" r="5" fill="#FF2D8D"/>
        <circle cx="1280" cy="940" r="5" fill="#00D4FF"/>

    </g>

</svg>